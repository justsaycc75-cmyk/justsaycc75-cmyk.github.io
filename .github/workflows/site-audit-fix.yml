name: One-time safe external-link fixes
on:
  push:
    paths:
      - '.github/workflows/site-audit-fix.yml'
permissions:
  contents: write
jobs:
  fix-links:
    if: github.event.head_commit.message == 'Fix external audit links'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified link fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Premier League changed its fixtures route; update any stale occurrences.
          for p in list(Path('.').glob('*.html')) + list(Path('.').glob('*.js')):
              s=p.read_text(encoding='utf-8')
              s=s.replace('https://www.premierleague.com/en/football/fixtures','https://www.premierleague.com/fixtures')
              p.write_text(s,encoding='utf-8')

          # Two streaming-service logo filenames on Wikimedia Commons had gone stale.
          p=Path('front.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Special:FilePath/Stan_Logo_2016.svg','Special:FilePath/Stan_logo.svg')
          s=s.replace('Special:FilePath/Foxtel_logo.svg','Special:FilePath/Foxtel_logo_2020.svg')
          p.write_text(s,encoding='utf-8')

          # Force the updated homepage helper script to refresh.
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'src="front\.js(?:\?[^\"]*)?"','src="front.js?v=20260924-audit2"',s)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify corrected targets
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          urls=[
            'https://www.premierleague.com/fixtures',
            'https://commons.wikimedia.org/wiki/Special:FilePath/Stan_logo.svg',
            'https://commons.wikimedia.org/wiki/Special:FilePath/Foxtel_logo_2020.svg'
          ]
          for u in urls:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=15)
                  print(r.status,r.geturl())
              except urllib.error.HTTPError as e:
                  print('HTTP',e.code,u)
                  raise
          PY
      - name: Commit corrected links
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'site-audit-bot'
          git config user.email 'site-audit-bot@users.noreply.github.com'
          git add front.js *.html
          git commit -m 'Fix stale Premier League and streaming logo links'
          git push
