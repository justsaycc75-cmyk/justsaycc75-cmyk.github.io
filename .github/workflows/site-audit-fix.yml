name: One-time external link and asset audit
on:
  push:
    paths:
      - '.github/workflows/site-audit-fix.yml'
permissions:
  contents: read
jobs:
  external-audit:
    if: github.event.head_commit.message == 'Run external site link audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links, YouTube IDs and image files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, urlencode
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import re, subprocess, json, urllib.request, urllib.error, socket

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls=[]; self.images=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for k in ('href','src','poster'):
                      v=d.get(k,'')
                      if v.startswith(('http://','https://')): self.urls.append(v)
                  if tag=='img' and d.get('src'): self.images.append(d['src'])

          urls=set(); local_images=set()
          for f in Path('.').glob('*.html'):
              p=P(); p.feed(f.read_text(encoding='utf-8')); urls.update(p.urls)
              for src in p.images:
                  if not src.startswith(('http://','https://','data:')):
                      local_images.add(src.split('?',1)[0].split('#',1)[0])

          # Add dynamically-created external links from front.js and watching.js.
          for f in ('front.js','watching.js'):
              txt=Path(f).read_text(encoding='utf-8')
              urls.update(re.findall(r'https?://[^\s\"\'<>`]+',txt))

          # Validate local image files are non-empty and recognized by `file`.
          image_report=[]
          for raw in sorted(local_images):
              p=Path(raw)
              if not p.exists():
                  image_report.append((raw,'MISSING',''))
                  continue
              if p.stat().st_size==0:
                  image_report.append((raw,'EMPTY',''))
                  continue
              cp=subprocess.run(['file','-b','--mime-type',str(p)],capture_output=True,text=True)
              mime=cp.stdout.strip()
              image_report.append((raw,'OK' if mime.startswith('image/') else 'BAD_TYPE',mime))

          ua='Mozilla/5.0 (compatible; site-audit/1.0)'
          def check_url(url):
              # YouTube watch/embed URLs: oEmbed confirms a current public video where supported.
              u=urlsplit(url)
              vid=''
              if 'youtube.com' in u.netloc:
                  if u.path=='/watch':
                      from urllib.parse import parse_qs
                      vid=parse_qs(u.query).get('v',[''])[0]
                  elif u.path.startswith('/embed/'):
                      vid=u.path.split('/embed/',1)[1].split('/',1)[0]
              elif 'youtu.be' in u.netloc:
                  vid=u.path.strip('/').split('/',1)[0]
              if vid:
                  o='https://www.youtube.com/oembed?'+urlencode({'url':'https://www.youtube.com/watch?v='+vid,'format':'json'})
                  req=urllib.request.Request(o,headers={'User-Agent':ua})
                  try:
                      with urllib.request.urlopen(req,timeout=12) as r:
                          return url,r.status,'YOUTUBE_OK',vid
                  except urllib.error.HTTPError as e:
                      return url,e.code,'YOUTUBE_FAIL',vid
                  except Exception as e:
                      return url,0,'UNCERTAIN',str(e)[:90]
              req=urllib.request.Request(url,headers={'User-Agent':ua},method='HEAD')
              try:
                  with urllib.request.urlopen(req,timeout=12) as r:
                      return url,r.status,'OK',''
              except urllib.error.HTTPError as e:
                  if e.code in (403,405,429):
                      # Many sites deliberately reject automated HEAD requests; GET is a better fallback.
                      try:
                          req2=urllib.request.Request(url,headers={'User-Agent':ua})
                          with urllib.request.urlopen(req2,timeout=12) as r:
                              return url,r.status,'OK_GET_FALLBACK',''
                      except urllib.error.HTTPError as e2:
                          return url,e2.code,'UNCERTAIN_BLOCKED',''
                      except Exception as e2:
                          return url,0,'UNCERTAIN',str(e2)[:90]
                  return url,e.code,'FAIL',''
              except Exception as e:
                  return url,0,'UNCERTAIN',str(e)[:90]

          results=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
              futs=[ex.submit(check_url,u) for u in sorted(urls)]
              for fut in as_completed(futs): results.append(fut.result())

          # Check all 200 direct song video IDs separately.
          script=Path('script.js').read_text(encoding='utf-8')
          block=script.split('const verifiedSongs=[',1)[1].split('];\nconst songRotation=',1)[0]
          song_ids=re.findall(r'videoId:\s*"([^"]+)"',block)
          song_results=[]
          def check_song(vid):
              o='https://www.youtube.com/oembed?'+urlencode({'url':'https://www.youtube.com/watch?v='+vid,'format':'json'})
              req=urllib.request.Request(o,headers={'User-Agent':ua})
              try:
                  with urllib.request.urlopen(req,timeout=12) as r: return vid,r.status,'OK'
              except urllib.error.HTTPError as e: return vid,e.code,'FAIL'
              except Exception as e: return vid,0,'UNCERTAIN'
          with ThreadPoolExecutor(max_workers=8) as ex:
              for r in ex.map(check_song,song_ids): song_results.append(r)

          definite=[r for r in results if r[2] in ('FAIL','YOUTUBE_FAIL') and r[1] in (404,410)]
          uncertain=[r for r in results if r[2].startswith('UNCERTAIN') or r[1]==0]
          yt_bad=[r for r in song_results if r[2]=='FAIL']
          yt_uncertain=[r for r in song_results if r[2]=='UNCERTAIN']
          bad_images=[r for r in image_report if r[1] != 'OK']

          print('=== EXTERNAL / MEDIA AUDIT ===')
          print('External URLs checked:',len(results))
          print('Definite 404/410 links:',json.dumps(definite,ensure_ascii=False))
          print('Blocked/timeout/uncertain external links:',len(uncertain))
          if uncertain[:20]: print('Uncertain sample:',json.dumps(uncertain[:20],ensure_ascii=False))
          print('Local images checked:',len(image_report),'bad:',json.dumps(bad_images,ensure_ascii=False))
          print('Song YouTube IDs checked:',len(song_results))
          print('Song IDs failing oEmbed:',json.dumps(yt_bad,ensure_ascii=False))
          print('Song IDs uncertain:',len(yt_uncertain))
          PY
