name: Website Health and Photo Repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/website-health.yml'
      - 'tools/site-health.mjs'
      - 'tools/cache-tour-photos.py'
      - 'tools/replace-duplicate-tour-photos.py'
  schedule:
    - cron: '17 * * * *'
    - cron: '37 19 * * *'
    - cron: '47 20 * * 0'
permissions:
  contents: read
concurrency:
  group: website-health
  cancel-in-progress: false
jobs:
  cache:
    if: github.event_name != 'schedule' || github.event.schedule == '37 19 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - name: Replace duplicate journal photographs
        id: duplicates
        continue-on-error: true
        run: python tools/replace-duplicate-tour-photos.py
      - name: Cache and validate photographs
        id: photos
        continue-on-error: true
        run: python tools/cache-tour-photos.py
      - name: Commit only validated photo repairs
        run: |
          git config user.name 'website-health[bot]'
          git config user.email 'website-health[bot]@users.noreply.github.com'
          git add world-cruise-journal.html assets/img/world-cruise-2029/tour-cache
          if ! git diff --cached --quiet; then
            git commit -m 'Cache validated licensed tour photographs'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-cache-report
          path: |
            health-report/photo-cache.json
            health-report/duplicate-photos.json
          retention-days: 14
      - name: Report unresolved photo improvements
        if: steps.photos.outcome == 'failure' || steps.duplicates.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          # Missing or invalid reports still fail: they indicate a crashed tool.
          # An existing report of rejected candidates is a quality warning.
          reports = [
              ("photo-cache.json", "failed"),
              ("duplicate-photos.json", "unresolved"),
          ]
          summary = []
          for filename, unresolved in reports:
              data = json.loads((Path("health-report") / filename).read_text())
              if not isinstance(data, list):
                  raise ValueError(f"Invalid photo report: {filename}")
              count = sum(item.get("status") == unresolved for item in data)
              if count:
                  print(f"::warning::{filename}: {count} photo improvements remain unresolved; existing photographs retained.")
                  summary.append(f"- {filename}: {count} unresolved improvements")
          if summary:
              import os
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                  output.write("## Photo improvement warnings\n" + "\n".join(summary) + "\n")
          PY
  audit:
    if: always()
    needs: [cache]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Audit public site
        env:
          SITE_URL: https://justsaycc75-cmyk.github.io/
          AUDIT_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '17 * * * *' && 'hourly' || 'full' }}
        run: node tools/site-health.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-health-report
          path: health-report/
          retention-days: 14
