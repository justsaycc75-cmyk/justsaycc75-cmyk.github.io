<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">HFGCS shortwave watch graphic</title><desc id="desc">Stylised shortwave spectrum and Emergency Action Message log marker</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06121b"/><stop offset="1" stop-color="#123543"/></linearGradient><linearGradient id="wave"><stop stop-color="#3dd5df"/><stop offset=".52" stop-color="#b7f477"/><stop offset="1" stop-color="#3dd5df"/></linearGradient><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#54a4b0" opacity=".12"/></pattern></defs>
<rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)"/>
<circle cx="826" cy="93" r="8" fill="#ff795e"/><text x="800" y="100" text-anchor="end" fill="#bfe9e3" font-family="Arial,sans-serif" font-size="21" letter-spacing="4">RADIO WATCH</text>
<text x="60" y="91" fill="#71d4e2" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="6">SHORTWAVE / HFGCS</text>
