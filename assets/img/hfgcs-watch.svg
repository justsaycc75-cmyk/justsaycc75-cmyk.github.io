<text x="60" y="234" fill="#a8c1c2" font-family="Arial,sans-serif" font-size="27">Emergency Action Message log</text>
<path d="M0 358H80l14-18 9 39 12-87 13 129 14-62h35l10-29 12 58 13-30h85l10-28 14 56 12-42h115l9-17 10 38 12-106 14 169 16-72h63l11-30 13 58 10-28h92l11-15 10 31 12-67 16 102 15-51h116" fill="none" stroke="url(#wave)" stroke-width="5" stroke-linejoin="round"/>
<path d="M0 358H960" stroke="#5b8991" opacity=".4"/>
<rect x="60" y="449" width="310" height="49" rx="9" fill="#143c44" stroke="#68c8cf" opacity=".95"/><text x="81" y="480" fill="#d4f5e8" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2">VIEW SOURCE LOG →</text>
